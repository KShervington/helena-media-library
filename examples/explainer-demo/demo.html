<!doctype html>
<!--
  Explainer demo + starter template (helena_loves_you): a 9:16 narration-synced composition built only from library assets.
  Hook words set in as they're spoken → pipeline mechanism reveals on narration words → packet travels → CTA; the voice visualizer
  moves whenever Helena speaks; captions follow the voice throughout. Every time comes from narration.json (stub here; real
  timings from the TTS runners) and levels.json (from levels.py; absent here, so the visualizer uses its stub mode).

  ?type=geometric|grotesk|eurostile (default grotesk) · ?viz=grid|trace|disc (default grid) · ?textless=1 for the no-caption master.

  Render (from the library root):
    P=assets/tools/render-pipeline
    python3 assets/tools/narration/stub-narration.py examples/explainer-demo/script.txt examples/explainer-demo/narration.json
    node $P/capture.mjs examples/explainer-demo/demo.html stills /tmp/demo-stills 1.2 4 8 13 18 24 30 --query "type=grotesk&viz=grid"
    node $P/capture.mjs examples/explainer-demo/demo.html frames /tmp/demo-frames --query "type=grotesk&viz=grid"
    bash $P/encode.sh /tmp/demo-frames narration.wav /tmp/explainer-demo.mp4 --poster 60
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../assets/brand/helena/tokens.css">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); font-family: var(--display); color: var(--text); -webkit-font-smoothing: antialiased; }
  .scene { position: absolute; inset: 0; }
  .meta { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-family: var(--label); font-size: 24px; letter-spacing: var(--hl-label-track); color: var(--muted); text-transform: uppercase; }
  .meta b { color: var(--text); font-weight: 500; }
  .rule { position: absolute; left: 390px; right: 390px; height: 1px; background: var(--line); }
  .index { position: absolute; left: 0; right: 0; top: 1560px; text-align: center; font-family: var(--label); font-size: 22px; letter-spacing: .3em; color: var(--muted); text-transform: uppercase; }
  /* hook */
  #h1 { position: absolute; left: 100px; right: 100px; top: 540px; text-align: center; font-size: var(--hl-h1); line-height: 1.08; letter-spacing: var(--hl-h1-track); font-weight: var(--h1-weight); text-wrap: balance; }
  #h1 .w { display: inline-block; margin-right: .22em; }
  #h1 .acc { color: var(--accent); }
  /* mechanism */
  #title { position: absolute; left: 100px; right: 100px; top: 400px; text-align: center; font-size: var(--hl-title); line-height: 1.15; font-weight: var(--h1-weight); text-wrap: balance; }
  #title .acc { color: var(--accent); }
  #fig { position: absolute; left: 222px; top: 600px; width: 636px; height: 700px; }
  /* cta */
  #cta { position: absolute; left: 100px; right: 100px; top: 760px; text-align: center; font-size: 64px; line-height: 1.2; font-weight: var(--h1-weight); text-wrap: balance; }
  #cta .acc { color: var(--accent); }
</style>
<script>window.GML = { root: "../.." };</script>
<script src="../../assets/tools/render-pipeline/core.js"></script>
<script src="../../assets/tools/narration/narration.js"></script>
<script src="../../assets/captions/word-sync/captions.js"></script>
<script src="../../assets/diagrams/pipeline/pipeline.js"></script>
<script src="../../assets/motion/voice-visualizer/visualizer.js"></script>
<script src="narration.json.js"></script>
</head>
<body>
<div id="stage">
  <div class="meta"><b>Helena</b> &nbsp;·&nbsp; demo</div>
  <div class="rule" style="top:200px"></div>
  <div id="viz" class="scene"></div>
  <div id="sHook" class="scene"><div id="h1"></div></div>
  <div id="sMech" class="scene">
    <div id="title">How a vision model <span class="acc">reads</span> an image</div>
    <div id="fig"></div>
  </div>
  <div id="sCta" class="scene"><div id="cta">Tell me what you want to understand next.<br><span class="acc">I will explain it.</span></div></div>
  <div class="rule" style="top:1500px"></div>
  <div id="captions" class="scene"></div>
  <div class="index" id="index"></div>
</div>
<script>
const { seg, lerp, ease, kf, ready } = GML.core;
const q = new URLSearchParams(location.search);
document.body.className = "hl-helena hl-type-" + (q.get("type") || "grotesk");
window.SIZE = { width: 1080, height: 1920 };

// Helena's motion: slow, flat, no overshoot
const slow = (x) => 1 - Math.pow(1 - x, 2);
let N, P, C, V, T = {};
window.ready = (async () => {
  N = GML.narration.create(window.NARRATION);
  window.DURATION = Math.ceil(N.duration + 0.5);

  V = GML.visualizer.create(document.getElementById("viz"), { style: q.get("viz") || "grid", levels: window.LEVELS || null, narration: N, x: 540, y: 300 });

  // hook: one span per word
  const hookWords = N.wordsBetween(N.beat("hook"), N.beat("proof"));
  document.getElementById("h1").innerHTML = hookWords.map((w) => `<span class="w ${["i","was."].includes(w.n) || w.w === "was." ? "acc" : ""}" data-s="${w.s}">${w.w}</span>`).join("");
  T.hookEnd = N.beat("mechanism");

  P = GML.pipeline.create(document.getElementById("fig"), { steps: [
    { label: "Image" }, { label: "256 tiles" }, { label: "Vision encoder" }, { label: "Tokens" }, { label: "Language model" } ], height: 96, gap: 40 });
  T.reveal = [N.at("picture"), N.at("divides"), N.at("pieces"), N.at("number"), N.at("language")];
  T.highlight = N.at("tiles");
  T.packet = [N.at("sentence"), N.end("reads")];
  T.ctaStart = N.beat("cta");

  C = GML.captions.create(document.getElementById("captions"), { narration: N, lines: [
    { from: "A", to: "days.", accent: ["forty", "thousand"] },
    { from: "Observe", to: "how.", accent: ["how."] },
    { from: "A", to: "picture.", accent: [] },
    { from: "So", to: "tiles.", accent: ["256", "tiles."] },
    { from: "Like", to: "pieces.", accent: [] },
    { from: "Nothing", to: "reordered.", accent: ["reordered."] },
    { from: "Each", to: "number.", accent: ["number."] },
    { from: "A", to: "machine.", accent: [] },
    { from: "So", to: "it.", accent: ["sentence,"] },
  ]});
  await ready([]);
  render(0);
})();

function render(t) {
  V.render(t);
  const sHook = document.getElementById("sHook"), sMech = document.getElementById("sMech"), sCta = document.getElementById("sCta");
  // HOOK — words arrive one by one, the whole block fades (no movement) when the mechanism begins
  sHook.style.display = t < T.hookEnd ? "" : "none";
  sHook.style.opacity = 1 - seg(t, T.hookEnd - 0.6, T.hookEnd);
  for (const w of document.querySelectorAll("#h1 .w")) w.style.opacity = slow(seg(t, +w.dataset.s, +w.dataset.s + 0.5));
  // MECHANISM
  const mechOn = t >= T.hookEnd && t < T.ctaStart;
  sMech.style.display = mechOn ? "" : "none";
  sMech.style.opacity = slow(seg(t, T.hookEnd, T.hookEnd + 0.8)) * (1 - seg(t, T.ctaStart - 0.6, T.ctaStart));
  const pk = t >= T.packet[0] && t <= T.packet[1] ? seg(t, T.packet[0], T.packet[1]) : null;
  P.render(t, { reveal: T.reveal, highlight: 1, highlightAt: T.highlight, packet: pk, dimOthers: t >= T.highlight && t < T.reveal[3] });
  // CTA
  sCta.style.display = t >= T.ctaStart ? "" : "none";
  sCta.style.opacity = slow(seg(t, T.ctaStart, T.ctaStart + 0.8));
  document.getElementById("index").textContent = t < T.hookEnd ? "01 — hook" : t < T.ctaStart ? "03 — mechanism" : "07 — request";
  C.render(t);
}
</script>
</body>
</html>
